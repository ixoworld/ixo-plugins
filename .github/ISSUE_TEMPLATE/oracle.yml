name: List my oracle
description: Ask for an IXO oracle to be added to the marketplace.
labels: [new-oracle]
body:
  - type: input
    id: url
    attributes:
      label: MCP endpoint
      placeholder: https://your-oracle.example/v1/mcp
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network
      placeholder: devnet / testnet / mainnet
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it decides
    validations:
      required: true
