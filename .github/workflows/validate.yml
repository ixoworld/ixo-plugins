name: validate

on:
  pull_request:
  push:
    branches: [main, develop]

# Read-only token: this workflow only checks files.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version-bump check diffs against the base branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test automatic plugin updates
        run: bun run test
      - name: Install the Claude Code CLI (for its plugin validator)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplaces and every plugin
        run: bun run validate
      - name: Catalogs and manifests match the Agent Plugins schemas
        run: bun scripts/check-schemas.ts
      - name: Generated plugins and README table match the templates
        run: |
          # Re-generate every plugin from template/<kind>/ (the kind and the --package/--major/--network
          # flags come from its catalog entry's metadata, an entry without metadata.kind is an oracle,
          # and --url is read back from the plugin's .mcp.json), rewrite the README table, and fail on
          # ANY change, including untracked generated files, which `git diff` would miss.
          bun scripts/regenerate.ts
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "Generated files are out of date. Run 'bun scripts/regenerate.ts' and commit:"
            echo "$status"
            git diff
            exit 1
          fi
      - name: Changed plugins carry a new version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-versions.ts "origin/$BASE_REF"
      - name: No secrets in the tree
        run: |
          ! grep -rInE 'eo_(live|test)_[0-9a-z]{8}_|sk_(live|test)_|BEGIN [A-Z ]*PRIVATE KEY|xox[abp]-' --exclude-dir=.git --exclude-dir=node_modules .
