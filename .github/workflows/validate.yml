name: validate

on:
  pull_request:
  push:
    branches: [main, develop]

# Read-only token: this workflow only checks files.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the Claude Code CLI (for its plugin validator)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplaces and every plugin
        run: bun run validate
      - name: Generated plugins match the template
        run: |
          # Re-generate every listed oracle plugin from template/ and fail on any drift.
          for dir in plugins/*/; do
            name=$(basename "$dir")
            url=$(jq -r '.mcpServers | to_entries[0].value.url' "$dir/.mcp.json")
            title=$(head -1 "$dir/README.md" | sed 's/^# //')
            version=$(jq -r .version "$dir/.claude-plugin/plugin.json")
            bun scripts/add-oracle.ts --name "$name" --title "$title" --url "$url" --version "$version" >/dev/null
          done
          git diff --exit-code
      - name: No secrets in the tree
        run: |
          ! grep -rInE 'eo_(live|test)_[0-9a-z]{8}_|sk_(live|test)_|BEGIN [A-Z ]*PRIVATE KEY|xox[abp]-' --exclude-dir=.git .
