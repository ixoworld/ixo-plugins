<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">IXO Plugins</title>
  <desc id="d">Get independent, signed decisions on claims from inside your AI assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#11243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ad6c5"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>

  <!-- left: wordmark -->
  <text x="72" y="150" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">IXO Plugins</text>
  <rect x="74" y="172" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="226" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#c7d2e0">Signed decisions on claims,</text>
  <text x="72" y="258" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#c7d2e0">right inside your AI assistant.</text>
  <text x="72" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7f93ad">Claude Code · Codex · any MCP app</text>

  <!-- right: a little receipt card -->
  <g transform="translate(760 64)">
    <rect width="368" height="232" rx="16" fill="#0f1b2d" stroke="#2a4466"/>
    <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7f93ad">claim apc_2776…a77</text>
    <rect x="24" y="64" width="112" height="34" rx="17" fill="#13342f"/>
    <circle cx="44" cy="81" r="7" fill="#3ad6c5"/>
    <text x="58" y="87" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#3ad6c5">approve</text>
    <text x="24" y="132" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c7d2e0">order known · code valid · GPS near</text>
    <text x="24" y="156" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c7d2e0">photo shows the parcel · not a duplicate</text>
    <line x1="24" y1="178" x2="344" y2="178" stroke="#2a4466"/>
    <path d="M28 203 l6 6 l12 -14" fill="none" stroke="#5b8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="209" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9db7ff">receipt signed by IXO's engine — verifies</text>
  </g>
</svg>
