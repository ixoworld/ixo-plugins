<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">How a claim gets decided</title>
  <desc id="d">You ask your assistant. It sends the claim to an IXO oracle. You approve the fee on IXO. The engine decides and signs a receipt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b8cff"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#0b1220"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- step boxes -->
    <g transform="translate(40 70)">
      <rect width="230" height="140" rx="14" fill="#0f1b2d" stroke="#2a4466"/>
      <text x="24" y="42" font-size="15" fill="#7f93ad">1</text>
      <text x="24" y="74" font-size="21" font-weight="600" fill="#ffffff">You ask</text>
      <text x="24" y="104" font-size="15" fill="#c7d2e0">"Submit this delivery</text>
      <text x="24" y="124" font-size="15" fill="#c7d2e0">and check the receipt."</text>
    </g>
    <g transform="translate(330 70)">
      <rect width="230" height="140" rx="14" fill="#0f1b2d" stroke="#2a4466"/>
      <text x="24" y="42" font-size="15" fill="#7f93ad">2</text>
      <text x="24" y="74" font-size="21" font-weight="600" fill="#ffffff">Assistant sends it</text>
      <text x="24" y="104" font-size="15" fill="#c7d2e0">to the oracle you</text>
      <text x="24" y="124" font-size="15" fill="#c7d2e0">signed in to</text>
    </g>
    <g transform="translate(620 70)">
      <rect width="230" height="140" rx="14" fill="#13342f" stroke="#3ad6c5"/>
      <text x="24" y="42" font-size="15" fill="#3ad6c5">3</text>
      <text x="24" y="74" font-size="21" font-weight="600" fill="#ffffff">You approve</text>
      <text x="24" y="104" font-size="15" fill="#c7d2e0">the fee, on IXO —</text>
      <text x="24" y="124" font-size="15" fill="#c7d2e0">never in the chat</text>
    </g>
    <g transform="translate(910 70)">
      <rect width="250" height="140" rx="14" fill="#0f1b2d" stroke="#5b8cff"/>
      <text x="24" y="42" font-size="15" fill="#9db7ff">4</text>
      <text x="24" y="74" font-size="21" font-weight="600" fill="#ffffff">Engine decides</text>
      <text x="24" y="104" font-size="15" fill="#c7d2e0">approve · reject · review,</text>
      <text x="24" y="124" font-size="15" fill="#c7d2e0">with a signed receipt</text>
    </g>
    <!-- arrows -->
    <line x1="274" y1="140" x2="324" y2="140" stroke="#5b8cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="564" y1="140" x2="614" y2="140" stroke="#5b8cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="854" y1="140" x2="904" y2="140" stroke="#5b8cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="40" y="262" font-size="15" fill="#7f93ad">Sign in once per oracle. Your token only works at that oracle, and every charge waits for your click.</text>
  </g>
</svg>
